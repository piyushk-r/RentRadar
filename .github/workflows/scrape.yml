# The freshness contract (PRD section 13): the 12h TTL is this cron line, and
# the distributed lock is the concurrency group. Scheduled runs are best-effort
# and can be delayed under platform load — the UI reports actual data age, never
# the schedule.
name: scrape

on:
  schedule:
    - cron: "0 */12 * * *" # the TTL, expressed as a schedule
  workflow_dispatch: # manual runs share the same lock as the cron (FR-5.3)

concurrency:
  group: scrape # the distributed lock, expressed as a policy
  cancel-in-progress: false

# contents: write for the data commit; pull-requests: write for the review
# queue (FR-7.4) — and nothing more (PRD section 21).
permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 14 categories at a polite request pace: the pipeline alone can take
    # ~45 minutes (provider-timeout-seconds: 2700).
    timeout-minutes: 75
    steps:
      # Third-party actions pinned to commit SHAs (PRD section 21).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, not the default depth-1: price history IS the git log
          # (AC-2.1). A shallow clone would make build-history.mjs see one
          # commit and overwrite every collected observation with a single point.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build pipeline (tests included — golden files catch markup drift)
        run: mvn -B -f pipeline/pom.xml verify

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.49.0

      - name: Install Playwright Chromium (for browser-rendered providers)
        run: mvn -B -q -f pipeline/pom.xml exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run pipeline
        id: pipeline
        # A non-zero exit means at least one provider failed. Its previous data
        # was kept (FR-5.4) and runs.json records the failure — both of which
        # should still be committed, so the job continues and fails at the end.
        continue-on-error: true
        # RentoMojo's host refuses GitHub's runner IP range (its robots.txt itself
        # answers 429 from here, while serving a home connection fine), so it is
        # left out of the scheduled run rather than failing it twice a day forever.
        # Its previous records and its runs.json entry are carried forward, so the
        # status page still shows how old its data is. refresh.ps1 from a home
        # connection is what refreshes it. Remove this flag on a runner that can
        # reach it.
        run: java -jar pipeline/target/pipeline.jar --pipeline.data-dir=data --pipeline.providers.rentomojo.enabled=false

      - name: Commit refreshed data
        run: |
          git config user.name "rentradar-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: scheduled refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: Rebuild price history from git (AC-2.1)
        run: |
          node tools/build-history.mjs
          git add data/history data/provider-stats.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "data: price history rebuilt from git log"
            git push
          fi

      - name: Open review-queue pull request (FR-7.4 / AC-2.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('data/pending-matches.json','utf8')).pending.filter(e => e.proposedCanonicalId).length)")
          if [ "$COUNT" -eq 0 ]; then
            echo "No proposable pending matches."
            exit 0
          fi
          # One review PR at a time: a human may have edited the open branch,
          # so never regenerate over it. The next run picks up the remainder.
          if [ "$(gh pr list --state open --head review-queue --json number --jq length)" != "0" ]; then
            echo "A review-queue PR is already open."
            exit 0
          fi
          git checkout -B review-queue
          node tools/propose-mappings.mjs > "$RUNNER_TEMP/pr-body.md"
          git add data/mappings.json data/catalogue.json data/pending-matches.json
          git commit -m "review queue: $COUNT proposed mapping(s)"
          git push -f origin review-queue
          gh pr create \
            --title "Review queue: $COUNT proposed mapping(s)" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --base main --head review-queue
          git checkout main

      - name: Fail the workflow if any provider failed
        # The failure email is the entire alerting system (FR-7.2).
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "Pipeline reported provider failure(s) — see the run log and data/runs.json."
          exit 1
